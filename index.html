<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lamadaughter | A Better Science Teacher</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: rgba(15, 23, 42, 0.7);
      --border-glass: rgba(56, 189, 248, 0.2);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
    }

    h1, h2, h3, .brand {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Animated Grid Overlay */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      pointer-events: none;
      z-index: -1;
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      background: rgba(7, 11, 20, 0.8);
      border-bottom: 1px solid var(--border-glass);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent-cyan);
    }

    /* Hero Section */
    .hero {
      min-height: 88vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 5%;
      position: relative;
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--border-glass);
      color: var(--accent-cyan);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(3.2rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 70%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero .subtitle {
      font-size: clamp(1.3rem, 3vw, 2rem);
      color: var(--accent-emerald);
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .hero p {
      max-width: 650px;
      color: var(--text-muted);
      font-size: 1.15rem;
      margin-bottom: 2.5rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 0.9rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), #2563eb);
      color: #070b14;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.6);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-glass);
    }

    .btn-secondary:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    /* Spinning CSS Atom */
    .atom-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
    }

    .nucleus {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      background: var(--accent-cyan);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px var(--accent-cyan);
    }

    .orbit {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 50%;
    }

    .orbit:nth-child(2) { transform: rotateX(65deg) rotateY(20deg); animation: spin1 4s linear infinite; }
    .orbit:nth-child(3) { transform: rotateX(65deg) rotateY(-40deg); animation: spin2 5s linear infinite; border-color: rgba(16, 185, 129, 0.4); }
    .orbit:nth-child(4) { transform: rotateX(65deg) rotateY(80deg); animation: spin3 6s linear infinite; border-color: rgba(168, 85, 247, 0.4); }

    @keyframes spin1 { 100% { transform: rotateX(65deg) rotateY(20deg) rotateZ(360deg); } }
    @keyframes spin2 { 100% { transform: rotateX(65deg) rotateY(-40deg) rotateZ(360deg); } }
    @keyframes spin3 { 100% { transform: rotateX(65deg) rotateY(80deg) rotateZ(360deg); } }

    /* Sections */
    section {
      padding: 5rem 5%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .section-sub {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 3.5rem;
    }

    /* Stats Bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 4rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .stat-num {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent-cyan);
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Subject Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 2rem;
      transition: transform 0.3s, border-color 0.3s;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-cyan);
    }

    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .card h3 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Interactive Fact Generator */
    .lab-box {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.7));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 24px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    #fact-display {
      font-size: 1.35rem;
      font-weight: 400;
      color: #e2e8f0;
      max-width: 750px;
      margin: 1.5rem auto 2rem auto;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Teaching Philosophy / Why Better */
    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .comp-box {
      padding: 2rem;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
    }

    .comp-box.highlight {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.1);
    }

    .comp-box ul {
      list-style: none;
      margin-top: 1.2rem;
    }

    .comp-box li {
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .comp-box.highlight li {
      color: var(--text-main);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border-glass);
      text-align: center;
      padding: 3rem 5%;
      color: var(--text-muted);
      margin-top: 4rem;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <!-- Navigation -->
  <nav>
    <div class="brand">⚛️ Lamadaughter</div>
    <ul class="nav-links">
      <li><a href="#subjects">Subjects</a></li>
      <li><a href="#method">The Method</a></li>
      <li><a href="#lab">Science Lab</a></li>
      <li><a href="#contact">Connect</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <div class="atom-wrapper">
      <div class="nucleus"></div>
      <div class="orbit"></div>
      <div class="orbit"></div>
      <div class="orbit"></div>
    </div>
    <span class="badge">Next-Generation STEM Education</span>
    <h1>Lamadaughter</h1>
    <div class="subtitle">A Better Science Teacher</div>
