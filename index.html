<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lamadaughter | Interactive Science Hub</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060913;
      --bg-panel: rgba(15, 23, 42, 0.78);
      --border-glass: rgba(56, 189, 248, 0.25);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --purple: #a855f7;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, .brand, .mono { font-family: 'Space Grotesk', sans-serif; }

    /* Interactive Particle Canvas Background */
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      background: rgba(6, 9, 19, 0.85);
      border-bottom: 1px solid var(--border-glass);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--cyan), var(--emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--cyan); }

    /* Hero */
    .hero {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 5%;
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border-glass);
      color: var(--cyan);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .hero h1 {
      font-size: clamp(3.2rem, 8vw, 6.2rem);
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #ffffff 25%, #38bdf8 65%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero .subtitle {
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      color: var(--emerald);
      font-weight: 600;
      margin-bottom: 1.2rem;
    }

    .hero p {
      max-width: 680px;
      color: var(--text-muted);
      font-size: 1.15rem;
      margin-bottom: 2.2rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 0.85rem 1.8rem;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      font-size: 0.98rem;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), #2563eb);
      color: #060913;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.6);
    }

    .btn-secondary {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border-glass);
    }

    .btn-secondary:hover {
      border-color: var(--cyan);
      transform: translateY(-2px);
    }

    /* Sections & Panels */
    section {
      padding: 4.5rem 5%;
      max-width: 1220px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-header h2 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin-bottom: 0.5rem;
    }

    .section-header p { color: var(--text-muted); }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-glass);
      border-radius: 22px;
      padding: 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    /* TOOL 1: Interactive Periodic Table */
    .filter-bar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      padding: 0.45rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-glass);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--cyan);
      color: #060913;
      font-weight: 600;
    }

    .periodic-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    .elements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 0.6rem;
    }

    .el-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.6rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }

    .el-card:hover, .el-card.selected {
      transform: scale(1.06);
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.18);
    }

    .el-num { font-size: 0.7rem; color: var(--text-muted); text-align: left; }
    .el-sym { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
    .el-name { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .el-inspector {
      background: rgba(10, 15, 28, 0.9);
      border: 1px solid var(--cyan);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .el-big-box {
      width: 90px;
      height: 90px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
      border: 2px solid var(--cyan);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }

    /* TOOL 2: Physics Projectile Simulator */
    .sim-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 2rem;
      align-items: center;
    }

    .control-group { margin-bottom: 1.2rem; }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    #sim-canvas {
      width: 100%;
      height: 280px;
      background: #04070f;
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      display: block;
    }

    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin-top: 1rem;
      text-align: center;
    }

    .tele-box {
      background: rgba(30, 41, 59, 0.5);
      padding: 0.7rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tele-val { font-size: 1.2rem; font-weight: 700; color: var(--emerald); }

    /* TOOL 3: Science Quiz Engine */
    .quiz-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .quiz-opt {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 1rem;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .quiz-opt:hover:not(:disabled) { border-color: var(--cyan); background: rgba(56, 189, 248, 0.12); }
    .quiz-opt.correct { background: rgba(16, 185, 129, 0.25); border-color: var(--emerald); }
    .quiz-opt.wrong { background: rgba(244, 63, 94, 0.25); border-color: var(--rose); }

    /* TOOL 4: Unit & Formula Calculator */
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .calc-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .calc-input {
      width: 100%;
      padding: 0.7rem;
      margin: 0.6rem 0;
      border-radius: 8px;
      border: 1px solid var(--border-glass);
      background: #060913;
      color: var(--text-main);
      font-size: 1rem;
    }

    footer {
      border-top: 1px solid var(--border-glass);
      text-align: center;
      padding: 3rem 5%;
      color: var(--text-muted);
      margin-top: 4rem;
    }

    @media (max-width: 850px) {
      .periodic-layout, .sim-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <nav>
    <div class="brand">⚛️ Lamadaughter</div>
    <ul class="nav-links">
